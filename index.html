<title>Dormie</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E4A30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column; a dark green hand-set scoreboard is the signature surface,
   everything else is quiet paper-white cards on a faint fairway-grey ground. */
:root {
  --bg: #ECEFEB;
  --surface: #FFFFFF;
  --surface-2: #F4F6F3;
  --ink: #13211A;
  --ink-2: #4A5950;
  --ink-3: #87948C;
  --line: #DBE1DB;
  --accent: #0E5A3A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEADF;
  --board: #0E4A30;
  --board-2: #0B3D27;
  --board-ink: #F3F0E4;
  --board-dim: #9DB8A8;
  --board-red: #EE6B5D;
  --flag: #E2A916;
  --flag-soft: #FBF0CF;
  --win: #157A49;
  --loss: #B33A2B;
  --side-a: #2459A6;
  --side-b: #B04A23;
  --shadow: 0 1px 2px rgba(19, 33, 26, .06), 0 4px 16px rgba(19, 33, 26, .06);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A100D; --surface: #121A16; --surface-2: #19231E; --ink: #E6EDE8; --ink-2: #A8B5AD; --ink-3: #6D7B73;
    --line: #25312B; --accent: #3DB37A; --accent-ink: #04140B; --accent-soft: #15301F;
    --board: #0D3A26; --board-2: #0A2F1F; --board-ink: #F1EEE2; --board-dim: #86A594; --board-red: #FF7E70;
    --flag: #F0BE3A; --flag-soft: #3A3115; --win: #4CC489; --loss: #F2725F; --side-a: #7FA9F2; --side-b: #F28E62;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A100D; --surface: #121A16; --surface-2: #19231E; --ink: #E6EDE8; --ink-2: #A8B5AD; --ink-3: #6D7B73;
  --line: #25312B; --accent: #3DB37A; --accent-ink: #04140B; --accent-soft: #15301F;
  --board: #0D3A26; --board-2: #0A2F1F; --board-ink: #F1EEE2; --board-dim: #86A594; --board-red: #FF7E70;
  --flag: #F0BE3A; --flag-soft: #3A3115; --win: #4CC489; --loss: #F2725F; --side-a: #7FA9F2; --side-b: #F28E62;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.page {
  flex: 1; display: flex; flex-direction: column; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) 120px;
}
/* A solid strip behind the status bar, so content scrolling up doesn't show through it
   (zero height in a normal browser tab; it matters in the iPhone app and home-screen web app). */
body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: 8px; min-height: 56px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.topbar .title { flex: 1; min-width: 0; text-align: center; }
.topbar .title b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .title span { font-size: 12px; color: var(--ink-3); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }

.wordmark { font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
.wordmark i { font-style: normal; color: var(--accent); }
.home-head { display: flex; align-items: flex-end; justify-content: space-between; padding-top: 10px; }
.home-head small { color: var(--ink-3); font-size: 13px; }
.home-head-right { display: flex; align-items: center; gap: 10px; }
.me-btn { border-radius: 50%; display: grid; place-items: center; }
.me-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.signin { justify-content: center; min-height: 100vh; min-height: 100dvh; padding-block: calc(24px + env(safe-area-inset-top, 0px)) 24px; }
.invite-card { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-2); box-shadow: inset 0 0 0 2px var(--accent-soft), var(--shadow); }
.invite-card b { color: var(--ink); font-size: 15px; }
.invite-panel { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 16px; background: var(--surface-2); }
.card.rows > .invite-panel:last-child { border-radius: 0 0 var(--r) var(--r); }
.invite-panel .input { background: var(--surface); font-size: 14px; }
.scan-match { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.4fr); align-items: center; gap: 10px; }
.scan-row { display: flex; flex-direction: column; gap: 10px; }
.scan-row + .scan-row { padding-top: 10px; border-top: 1px solid var(--line); }
.scan-new { padding-left: 4px; }
.scan-match .on-card { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scan-match .arrow { color: var(--ink-3); width: 18px; height: 18px; display: grid; }
.scan-match select.input { height: 42px; }
table.scan-grid input { width: 30px; height: 30px; border: 0; border-radius: 6px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); text-align: center; font: inherit; font-weight: 700; color: var(--ink); padding: 0; }
table.scan-grid input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
table.scan-grid tr.skipped td { opacity: .45; }
.game-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; border: 1.5px solid transparent; }
/* A real border (not an inset shadow), so the open game is framed all the way around its settings. */
.game-card.open { border-color: var(--accent); }
.game-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: left; }
.game-head .grow { flex: 1; min-width: 0; }
.game-head .t { font-weight: 800; font-size: 16px; }
.game-head .d { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.game-head .d.neg { color: var(--loss); font-weight: 650; }
.game-head .chev { color: var(--ink-3); width: 20px; height: 20px; display: grid; flex: none; margin-left: auto; transition: transform .2s; }
.game-card.open .chev { transform: rotate(90deg); }
.game-body { display: flex; flex-direction: column; gap: 20px; padding: 14px 12px; background: var(--surface-2); border-top: 1px solid var(--line); }
.game-foot { display: flex; justify-content: space-between; gap: 10px; }
.add-games { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.add-game { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: var(--r); background: var(--surface);
  box-shadow: inset 0 0 0 1.5px var(--line); text-align: left; min-height: 104px; }
.add-game .plus { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 4px; }
.add-game .plus svg { width: 16px; height: 16px; }
.add-game b { font-size: 15px; }
.add-game small { font-size: 12px; color: var(--ink-3); line-height: 1.35; }
.add-game:disabled { opacity: .55; }
.add-game:not(:disabled):active { box-shadow: inset 0 0 0 2px var(--accent); }
.np-setup { display: flex; flex-direction: column; }
.np-setup > * + * { border-top: 1px solid var(--line); }
.chip:disabled { opacity: .4; }
.neg { color: var(--loss); }
.np-card { display: flex; flex-direction: column; gap: 12px; }
.np-card .section-head { flex-direction: column; align-items: flex-start; gap: 2px; }
.np-hole { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13.5px; color: var(--ink-2); }
.np-hole b { color: var(--ink); }
.np-rows { display: flex; flex-direction: column; }
.np-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.np-row + .np-row { border-top: 1px solid var(--line); }
.np-row .grow { flex: 1; min-width: 0; font-weight: 650; }
.np-pts { color: var(--ink-2); font-weight: 700; font-size: 13.5px; }
table.sc td.np-sweep { background: var(--flag-soft); font-weight: 800; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
.form-error { font-size: 13.5px; font-weight: 600; color: var(--loss); }

h1.h { font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .005em; }
.sub { color: var(--ink-2); margin: 4px 0 0; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.section-head .meta { font-size: 12.5px; color: var(--ink-3); }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.card.pad { padding: 16px; }
.rows > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 12.5px; color: var(--ink-3); }
button.row { width: 100%; text-align: left; }
button.row:hover { background: var(--surface-2); }
.rows > button.row:first-child { border-radius: var(--r) var(--r) 0 0; }
.rows > button.row:last-child { border-radius: 0 0 var(--r) var(--r); }

/* Avatars */
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff;
  font-weight: 800; font-size: 13.5px; letter-spacing: .02em; position: relative; }
.av.sm { width: 28px; height: 28px; font-size: 11px; }
.av.xs { width: 22px; height: 22px; font-size: 9.5px; }
.av-stack { display: flex; }
.av-stack .av { box-shadow: 0 0 0 2px var(--surface); }
.av-stack .av + .av { margin-left: -8px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px;
  border-radius: 14px; font-weight: 750; font-size: 15.5px; transition: transform .08s ease, background .15s; }
.btn:active { transform: scale(.98); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: transparent; color: var(--loss); box-shadow: inset 0 0 0 1px var(--line); }
.btn.block { width: 100%; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13.5px; border-radius: 11px; }
.btn.lg { height: 56px; font-size: 17px; border-radius: 16px; }
.link { color: var(--accent); font-weight: 700; font-size: 13.5px; }

/* Segmented control and chips */
.seg { display: flex; background: var(--surface-2); padding: 4px; border-radius: 13px; gap: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { flex: 1; min-width: 0; height: 38px; border-radius: 10px; font-weight: 700; font-size: 13.5px; color: var(--ink-2); padding: 0 6px; line-height: 1.1; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg.tall button { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.seg.tall button small { font-size: 11px; font-weight: 600; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 34px; padding: 0 13px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); box-shadow: none; }

/* Toggle switch */
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* Stepper */
.stepper { display: flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); }
.stepper button { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--ink-2); }
.stepper button:hover { background: var(--surface); }
.stepper button svg { width: 18px; height: 18px; }
.stepper output { min-width: 52px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Inputs */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
.input { height: 46px; border-radius: 12px; border: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
  padding: 0 14px; width: 100%; min-width: 0; font-size: 16px; }
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .span { grid-column: 1 / -1; }

/* Scoreboard — the signature surface */
.board { background: var(--board); color: var(--board-ink); border-radius: 18px; overflow: hidden; position: relative;
  box-shadow: 0 10px 30px rgba(14, 74, 48, .25); }
.board::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.04) 39px 40px); }
.board-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; position: relative; }
.board-title { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
.board-tag { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--board-dim); display: flex; align-items: center; gap: 6px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--board-red); box-shadow: 0 0 0 0 var(--board-red); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(238,107,93,.6); } 70% { box-shadow: 0 0 0 8px rgba(238,107,93,0); } 100% { box-shadow: 0 0 0 0 rgba(238,107,93,0); } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } * { transition: none !important; } }
.board-rows { position: relative; }
.board-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 8px 16px; border-top: 1px solid rgba(255,255,255,.08); }
.board-row .pname { font-family: var(--display); font-weight: 600; font-size: 21px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.board-row .thru { font-size: 12px; color: var(--board-dim); font-weight: 700; letter-spacing: .06em; }
.tile { font-family: var(--display); font-weight: 700; font-size: 22px; min-width: 64px; height: 34px; padding: 0 8px; display: grid; place-items: center;
  background: var(--board-2); border-radius: 6px; box-shadow: inset 0 -1px 0 rgba(255,255,255,.06), inset 0 1px 2px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.tile.up { color: var(--board-ink); }
.tile.down { color: var(--board-red); }
.board-foot { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12.5px; color: var(--board-dim); font-weight: 600; }
.board-foot b { color: var(--board-ink); }
button.board { text-align: left; width: 100%; }

/* Setup wizard */
.steps { display: flex; gap: 6px; }
.steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .25s; }
.steps span.on { background: var(--accent); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: linear-gradient(to top, var(--bg) 70%, transparent);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.dock-inner { max-width: 488px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.dock-inner .hint { font-size: 12.5px; color: var(--ink-3); flex: 1; }

.pick { display: flex; align-items: center; gap: 12px; padding: 10px 14px; width: 100%; text-align: left; min-height: 62px; }
.pick .check { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; flex: none; color: transparent; transition: all .15s; }
.pick .check svg { width: 16px; height: 16px; }
.pick[aria-pressed="true"] .check { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.pick:disabled { opacity: .4; cursor: not-allowed; }
.tray { display: flex; gap: 10px; min-height: 66px; align-items: center; overflow-x: auto; padding: 4px 2px; }
.tray-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 54px; flex: none; font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
.tray-slot .empty { width: 42px; height: 42px; border-radius: 50%; border: 2px dashed var(--line); }
.tray-slot .av { width: 42px; height: 42px; }
.tray-slot span { max-width: 54px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.side-toggle { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 11px; box-shadow: inset 0 0 0 1px var(--line); }
.side-toggle button { width: 40px; height: 32px; border-radius: 8px; font-weight: 800; font-size: 13px; color: var(--ink-3); }
.side-toggle button[aria-pressed="true"].a { background: var(--side-a); color: #fff; }
.side-toggle button[aria-pressed="true"].b { background: var(--side-b); color: #fff; }
.side-toggle button[aria-pressed="true"].x { background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow); }
.opt { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.opt .grow { flex: 1; min-width: 0; }
.opt .t { font-weight: 700; }
.opt .d { font-size: 12.5px; color: var(--ink-3); }
.opt-sub { padding: 0 16px 14px; }
.summary { background: var(--accent-soft); color: var(--accent); border-radius: var(--r); padding: 14px 16px; font-weight: 700; font-size: 14px; line-height: 1.5; }
.summary .big { font-family: var(--display); font-size: 26px; display: block; line-height: 1.1; letter-spacing: .01em; }
.pops { display: inline-flex; gap: 3px; vertical-align: middle; }
.pops i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); display: block; }
.pops i.minus { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.strokes-chip { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }

/* Round */
.holes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px; scroll-snap-type: x proximity; }
.holes::-webkit-scrollbar { display: none; }
